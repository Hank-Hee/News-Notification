theme: jekyll-theme-cayman
title: Horizon AI Daily
description: 每日中文 AI 前沿与产品研究简报
baseurl: "/News-Notification"
url: "https://hank-hee.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
