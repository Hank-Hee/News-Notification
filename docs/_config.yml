theme: jekyll-theme-cayman
title: AI 产品机会与 Builder 情报
description: 为 AI 产品经理转型与个人产品探索定制的一手产品情报
baseurl: "/News-Notification"
url: "https://hank-hee.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
