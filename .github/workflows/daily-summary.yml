name: Daily Horizon AI Summary

on:
  schedule:
    - cron: "30 8 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose sources_only to validate collection without any AI calls"
        required: true
        default: sources_only
        type: choice
        options:
          - sources_only
          - full

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL || 'https://api.moonshot.cn/v1' }}
      KIMI_MODEL_ID: ${{ vars.KIMI_MODEL_ID || 'kimi-k2.6' }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      DEEPSEEK_CANDIDATE_MODEL: ${{ vars.DEEPSEEK_CANDIDATE_MODEL || 'deepseek-v4-flash' }}
      DEEPSEEK_FALLBACK_MODEL: ${{ vars.DEEPSEEK_FALLBACK_MODEL || 'deepseek-v4-pro' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.26"
          prune-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Validate Kimi configuration
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'full'
        shell: bash
        run: |
          test -n "$MOONSHOT_API_KEY" || { echo "Missing repository secret: MOONSHOT_API_KEY"; exit 1; }
          if [ -z "$KIMI_BASE_URL" ]; then
            KIMI_BASE_URL="https://api.moonshot.cn/v1"
            echo "KIMI_BASE_URL=https://api.moonshot.cn/v1" >> "$GITHUB_ENV"
          fi
          test "$KIMI_MODEL_ID" = "kimi-k2.6" || { echo "KIMI_MODEL_ID must be kimi-k2.6"; exit 1; }

          response_file="$RUNNER_TEMP/kimi-models.json"
          http_status=$(curl --silent --show-error \
            --connect-timeout 15 --max-time 30 \
            --output "$response_file" --write-out "%{http_code}" \
            --header "Authorization: Bearer $MOONSHOT_API_KEY" \
            "${KIMI_BASE_URL%/}/models")
          if [ "$http_status" != "200" ]; then
            error_type=$(jq -r '.error.type // "unknown_error"' "$response_file" 2>/dev/null || true)
            echo "Kimi API preflight failed: HTTP $http_status ($error_type)"
            exit 1
          fi
          jq -e --arg model "$KIMI_MODEL_ID" \
            '.data[] | select(.id == $model)' "$response_file" >/dev/null || {
              echo "Kimi API preflight failed: model $KIMI_MODEL_ID is unavailable to this key"
              exit 1
            }
          echo "Kimi API preflight passed for $KIMI_MODEL_ID"

      - name: Validate DeepSeek configuration
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'full'
        shell: bash
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo "Missing repository secret: DEEPSEEK_API_KEY"; exit 1; }
          test "$DEEPSEEK_BASE_URL" = "https://api.deepseek.com" || {
            echo "DEEPSEEK_BASE_URL must use the official China API: https://api.deepseek.com"
            exit 1
          }
          test "$DEEPSEEK_CANDIDATE_MODEL" = "deepseek-v4-flash" || {
            echo "DEEPSEEK_CANDIDATE_MODEL must be deepseek-v4-flash"
            exit 1
          }
          test "$DEEPSEEK_FALLBACK_MODEL" = "deepseek-v4-pro" || {
            echo "DEEPSEEK_FALLBACK_MODEL must be deepseek-v4-pro"
            exit 1
          }

          response_file="$RUNNER_TEMP/deepseek-models.json"
          http_status=$(curl --silent --show-error \
            --connect-timeout 15 --max-time 30 \
            --output "$response_file" --write-out "%{http_code}" \
            --header "Authorization: Bearer $DEEPSEEK_API_KEY" \
            "${DEEPSEEK_BASE_URL%/}/models")
          if [ "$http_status" != "200" ]; then
            error_type=$(jq -r '.error.type // "unknown_error"' "$response_file" 2>/dev/null || true)
            echo "DeepSeek API preflight failed: HTTP $http_status ($error_type)"
            exit 1
          fi
          for model in "$DEEPSEEK_CANDIDATE_MODEL" "$DEEPSEEK_FALLBACK_MODEL"; do
            jq -e --arg model "$model" '.data[] | select(.id == $model)' \
              "$response_file" >/dev/null || {
                echo "DeepSeek API preflight failed: model $model is unavailable to this key"
                exit 1
              }
          done
          echo "DeepSeek API preflight passed for $DEEPSEEK_CANDIDATE_MODEL and $DEEPSEEK_FALLBACK_MODEL"

      - name: Validate Apify configuration
        shell: bash
        run: |
          test -n "$APIFY_TOKEN" || { echo "Missing repository secret: APIFY_TOKEN"; exit 1; }
          response_file="$RUNNER_TEMP/apify-user.json"
          http_status=$(curl --silent --show-error \
            --connect-timeout 15 --max-time 30 \
            --output "$response_file" --write-out "%{http_code}" \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            "https://api.apify.com/v2/users/me")
          if [ "$http_status" != "200" ]; then
            echo "Apify API preflight failed: HTTP $http_status"
            exit 1
          fi
          for actor in "altimis~scweet" "apify~website-content-crawler"; do
            safe_actor_name=${actor//~/_}
            actor_file="$RUNNER_TEMP/apify-actor-$safe_actor_name.json"
            actor_status=$(curl --silent --show-error \
              --connect-timeout 15 --max-time 30 \
              --output "$actor_file" --write-out "%{http_code}" \
              --header "Authorization: Bearer $APIFY_TOKEN" \
              "https://api.apify.com/v2/acts/$actor")
            if [ "$actor_status" != "200" ]; then
              error_type=$(jq -r '.error.type // "unknown_error"' "$actor_file" 2>/dev/null || true)
              echo "Apify Actor $actor preflight failed: HTTP $actor_status ($error_type)"
              exit 1
            fi
          done
          echo "Apify API preflight passed for X and newsletter actors"

      - name: Prepare runtime configuration
        run: cp data/config.github.json data/config.json

      - name: Restore history and product intelligence database
        shell: bash
        run: |
          mkdir -p data/history
          git fetch origin gh-pages --depth=1 || true
          git show origin/gh-pages:data/history/event_index.json > data/history/event_index.json || true
          git show origin/gh-pages:data/history/analysis_cache.json > data/history/analysis_cache.json || true
          git show origin/gh-pages:data/product-intelligence.json > data/product-intelligence.json || true
          git show origin/gh-pages:data/product-intelligence.csv > data/product-intelligence.csv || true

      - name: Validate sources without AI
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'sources_only'
        run: uv run horizon --hours 24 --validate-sources-only

      - name: Generate Chinese AI daily
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'full'
        run: uv run horizon --hours 24

      - name: Set publication date
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'full'
        shell: bash
        run: echo "DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Deploy to GitHub Pages
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'full'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "Daily AI summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
